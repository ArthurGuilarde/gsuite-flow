<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guilarde Suite</title>
  <link rel="stylesheet" href="/css/suite.css">
</head>
<body>
  <main>
    <h1>Guilarde Suite</h1>
    <p id="status" role="status" aria-live="polite">Carregando sessão…</p>
    <a id="login" href="/auth/login" hidden>Entrar com Guilarde</a>
    <section id="workspace" hidden>
      <div class="toolbar">
        <label>Espaço <select id="tenant"></select></label>
        <button id="logout" type="button">Sair</button>
      </div>
      <div id="content"></div>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
