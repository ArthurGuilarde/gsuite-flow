<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GFlow</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/suite.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Navegação principal">
      <div class="marca">GFlow</div>
      <nav id="nav" class="nav" hidden>
        <a href="#/meu-dia" data-rota="/meu-dia">Meu Dia</a>
        <a href="#/" data-rota="/">Painel</a>
        <a href="#/rotinas" data-rota="/rotinas">Rotinas</a>
        <a href="#/lancamentos" data-rota="/lancamentos">Lançamentos</a>
        <div class="nav-secao">FinOps</div>
        <a href="#/finops" data-rota="/finops">Painel FinOps</a>
        <a href="#/finops/iniciativas" data-rota="/finops/iniciativas">Iniciativas</a>
        <a href="#/finops/faturas" data-rota="/finops/faturas">Faturas</a>
        <div class="nav-secao">Despesas</div>
        <a href="#/despesas" data-rota="/despesas">Painel de despesas</a>
        <a href="#/despesas/inventario" data-rota="/despesas/inventario">Inventário</a>
        <a href="#/despesas/orcamento" data-rota="/despesas/orcamento">Orçamento</a>
        <div class="nav-secao">Demandas</div>
        <a href="#/demandas" data-rota="/demandas">Demandas</a>
        <a href="#/demandas/triagem" data-rota="/demandas/triagem" data-escrita hidden>Triagem</a>
        <div class="nav-secao">Configuração</div>
        <a href="#/config/grupos" data-rota="/config/grupos">Grupos</a>
        <a href="#/config/semanas" data-rota="/config/semanas">Semanas</a>
        <a href="#/config/rotinas" data-rota="/config/rotinas">Catálogo de rotinas</a>
        <a href="#/config/perfis" data-rota="/config/perfis">Perfis de custo/hora</a>
      </nav>
    </aside>
    <div class="principal">
      <header class="topbar">
        <button id="menu" class="icone-botao" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="titulos">
          <h1 id="pagina-titulo">GFlow</h1>
          <p id="pagina-subtitulo" class="subtitulo"></p>
        </div>
        <div id="workspace" class="toolbar" hidden>
          <label class="campo-inline">Espaço <select id="tenant"></select></label>
          <button id="logout" type="button" class="secundario">Sair</button>
        </div>
      </header>
      <main class="conteudo-area">
        <p id="status" role="status" aria-live="polite">Carregando sessão…</p>
        <a id="login" class="botao" href="/auth/login" hidden>Entrar com Guilarde</a>
        <div id="content"></div>
      </main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="confirmacao" class="modal">
    <form method="dialog">
      <p id="confirmacao-texto"></p>
      <div class="acoes">
        <button type="submit" value="cancel" class="secundario">Cancelar</button>
        <button type="submit" value="ok" id="confirmacao-ok" class="perigo">Confirmar</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
